server.port=8080

# ---- OpenAI ------------------------------------------------------------------
openai.base-url=https://api.openai.com/v1
openai.api-key=
openai.model=gpt-6-luna
openai.timeout-seconds=60
# Reasoning models need "none" to use tool calling on /chat/completions. Leave blank for models without reasoning.
openai.reasoning-effort=none

# ---- Chat --------------------------------------------------------------------
chat.max-steps=5
# Past exchanges re-sent to OpenAI with each message.
chat.max-history-turns=10
chat.default-products-shown=6

# ---- Catalog -----------------------------------------------------------------
# products.json is loaded into an in-memory H2 database on every start.
catalog.json-path=../products.json
catalog.batch-size=1000
# Distinct products returned per search, picked from the top search-candidates matches after removing
# duplicate listings (each size/colour of a product is its own listing with the same title).
catalog.search-limit=8
catalog.search-candidates=40
spring.datasource.url=jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
